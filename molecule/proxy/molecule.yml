---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: authkeysync-proxy
    image: ubuntu:24.04
provisioner:
  name: ansible
  env:
    # Resolver el rol desde el repo (el directorio padre del rol, que se llama
    # mikroways.authkeysync) y no desde una copia en ~/.ansible/roles.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      all:
        ansible_user: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
