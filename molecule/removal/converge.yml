---
# Strict-mode key removal control. Every case runs the role itself (not the binary).
# The first play only runs under `molecule check` (--check); the second only in
# `molecule converge`, so both modes are covered by the same file.
- name: Check mode (molecule check)
  hosts: all
  become: false
  gather_facts: true
  vars:
    ak: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
  tasks:
    - name: Snapshot authorized_keys
      ansible.builtin.stat:
        path: "{{ ak }}"
      register: ak_before
      when: ansible_check_mode

    # c. In --check mode it does not stop: the removal is a pending change (the key
    # is listed), the rest of the run goes on and authorized_keys is not touched.
    - name: Include role in check mode
      ansible.builtin.include_role:
        name: mikroways.authkeysync
      when: ansible_check_mode

    - name: Snapshot authorized_keys again
      ansible.builtin.stat:
        path: "{{ ak }}"
      register: ak_after_check
      when: ansible_check_mode

    - name: Assert check mode reported the removal and went on
      ansible.builtin.assert:
        that:
          - authkeysync_removal_preview is changed
          - "'stale@test' in authkeysync_removal_preview.results[0].item"
          - authkeysync_bin_dir_result is changed
          - ak_after_check.stat.checksum == ak_before.stat.checksum
      when: ansible_check_mode

- name: Converge
  hosts: all
  become: false
  gather_facts: true
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
    ak: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
    source_url: "https://mikroways.gitlab.io/public/ssh_keys/_all.pub"
    stale_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDx5/coTRWTAsqTAhL5xLWb75ZnSA2mN8i5ROQ9KXBTY stale@test\n"
  tasks:
    - name: Cases that change the host (skipped under --check)
      when: not ansible_check_mode
      block:
        - name: Snapshot authorized_keys
          ansible.builtin.stat:
            path: "{{ ak }}"
          register: ak_before

        # a. A key missing from the sources stops the role and nothing changes.
        - name: Run the role (must stop)
          block:
            - name: Include role
              ansible.builtin.include_role:
                name: mikroways.authkeysync
            - name: Fail if the role did not stop
              ansible.builtin.fail:
                msg: "the role should have stopped"
          rescue:
            - name: Assert the stale key is listed
              ansible.builtin.assert:
                that:
                  - "'Strict mode would remove 1 key(s)' in ansible_failed_result.msg"
                  - "'stale@test' in ansible_failed_result.msg"
                  - "'ED25519' in ansible_failed_result.msg"
                  - "'SHA256:' in ansible_failed_result.msg"

        # c2. Same when check mode is requested with the check_mode keyword (not --check).
        - name: Run the role with check_mode on a block
          check_mode: true
          block:
            - name: Include role
              ansible.builtin.include_role:
                name: mikroways.authkeysync

        - name: Assert the keyword was detected as check mode
          ansible.builtin.assert:
            that:
              - authkeysync_check_mode
              - authkeysync_removal_preview is changed
              - "'stale@test' in authkeysync_removal_preview.results[0].item"

        # An unreachable source: say which one, touch nothing.
        - name: Run the role with an unreachable source (must stop)
          block:
            - name: Include role
              ansible.builtin.include_role:
                name: mikroways.authkeysync
              vars:
                authkeysync_sources:
                  - url: "http://127.0.0.1:9/keys.pub"
            - name: Fail if the role did not stop
              ansible.builtin.fail:
                msg: "the role should have stopped"
          rescue:
            - name: Assert the failing source is named
              ansible.builtin.assert:
                that:
                  - "'http://127.0.0.1:9/keys.pub' in ansible_failed_result.msg"
                  - "'Nothing was changed' in ansible_failed_result.msg"

        - name: Check what the stopped runs left behind
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ ak }}"
            - "{{ home }}/.config/authkeysync/config.yaml"
            - "{{ home }}/.local/bin/authkeysync"
          register: after_stop

        - name: Read the crontab
          ansible.builtin.command: crontab -l
          register: crontab_after_stop
          changed_when: false
          failed_when: false

        - name: Assert nothing was changed (authorized_keys, config, binary, cron)
          ansible.builtin.assert:
            that:
              - after_stop.results[0].stat.checksum == ak_before.stat.checksum
              - not after_stop.results[1].stat.exists
              - not after_stop.results[2].stat.exists
              - "'AuthKeySync' not in crontab_after_stop.stdout"

        # Keys with options (from="...", command="...") are compared by their key
        # blob: the one that is in the source is kept out of the list, the other is not.
        - name: Fetch the source to take a real key from it
          ansible.builtin.uri:
            url: "{{ source_url }}"
            return_content: true
          register: source_fetch

        - name: Plant two keys with options, one of them in the source
          ansible.builtin.copy:
            dest: "{{ ak }}"
            content: |
              from="10.0.0.1",no-pty {{ source_fetch.content.splitlines() | select('match', '^(ssh-|ecdsa-|sk-)') | first }}
              command="/bin/true",no-pty {{ stale_key }}
            mode: "0600"

        - name: Run the role with keys that have options (must stop)
          block:
            - name: Include role
              ansible.builtin.include_role:
                name: mikroways.authkeysync
              vars:
                authkeysync_sources:
                  - url: "{{ source_url }}"
            - name: Fail if the role did not stop
              ansible.builtin.fail:
                msg: "the role should have stopped"
          rescue:
            - name: Assert only the key that is not in the source is listed
              ansible.builtin.assert:
                that:
                  - "'Strict mode would remove 1 key(s)' in ansible_failed_result.msg"
                  - "'stale@test' in ansible_failed_result.msg"

        # Without ssh-keygen the keys are still listed, as raw lines with the comment.
        - name: Restore the original authorized_keys
          ansible.builtin.copy:
            dest: "{{ ak }}"
            content: "{{ stale_key }}"
            mode: "0600"

        - name: Run the role without ssh-keygen (must stop and list the key)
          block:
            - name: Move ssh-keygen out of the way
              become: true
              ansible.builtin.command: mv /usr/bin/ssh-keygen /usr/bin/ssh-keygen.off
              changed_when: true
            - name: Include role
              ansible.builtin.include_role:
                name: mikroways.authkeysync
              vars:
                authkeysync_sources:
                  - url: "{{ source_url }}"
            - name: Fail if the role did not stop
              ansible.builtin.fail:
                msg: "the role should have stopped"
          rescue:
            - name: Assert the key is listed as a raw line
              ansible.builtin.assert:
                that:
                  - "'Strict mode would remove 1 key(s)' in ansible_failed_result.msg"
                  - "'stale@test' in ansible_failed_result.msg"
                  - "'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5...' in ansible_failed_result.msg"
                  - "'SHA256:' not in ansible_failed_result.msg"
          always:
            - name: Put ssh-keygen back
              become: true
              ansible.builtin.command: mv /usr/bin/ssh-keygen.off /usr/bin/ssh-keygen
              changed_when: true

        # b. With the removal accepted the role goes on and removes the key.
        # d. That run changes authorized_keys; the next one does not.
        - name: Run the role accepting the removal
          ansible.builtin.include_role:
            name: mikroways.authkeysync
          vars:
            authkeysync_allow_key_removal: true

        - name: Assert the first run reported changed
          ansible.builtin.assert:
            that: authkeysync_initial_sync is changed

        - name: Read authorized_keys
          ansible.builtin.slurp:
            src: "{{ ak }}"
          register: ak_after

        - name: Assert the stale key is gone and the sources were applied
          ansible.builtin.assert:
            that:
              - "'stale@test' not in (ak_after.content | b64decode)"
              - (ak_after.content | b64decode | length) > 0

        - name: Run the role again
          ansible.builtin.include_role:
            name: mikroways.authkeysync
          vars:
            authkeysync_allow_key_removal: true

        - name: Assert the second run reported ok
          ansible.builtin.assert:
            that: authkeysync_initial_sync is not changed
