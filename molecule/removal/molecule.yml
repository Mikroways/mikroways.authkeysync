---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: authkeysync-removal
    image: ubuntu:24.04
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: ansible
verifier:
  name: ansible
scenario:
  # Everything is asserted in converge.yml (it runs the role several times, so it
  # is not idempotent by design and has no idempotence step).
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - destroy
